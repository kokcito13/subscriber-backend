name: Deploy to InfinityFree (FTP)

on:
  push:
    branches: [ "main" ]   # change if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"   # updated to match composer.json & lockfile
          tools: composer

      - name: Install dependencies (prod)
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      # Optional: run tests
      # - name: Run tests
      #   run: |
      #     php bin/phpunit

      - name: Create Symfony env file for server
        run: |
          cat > .env.local <<'EOF'
          APP_ENV=prod
          APP_DEBUG=0
          APP_SECRET=${{ secrets.APP_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          EOF

      # IMPORTANT: shared hosting needs writable var/
      - name: Prepare deploy folder
        run: |
          rm -rf var/cache var/log
          mkdir -p var/cache var/log

      - name: Install rsync and sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync sshpass

      - name: Deploy files via rsync over SSH (password auth)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          # Use sshpass to provide the SSH password to rsync/ssh
          sshpass -e rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".idea/" \
            --exclude ".dockerignore" \
            --exclude "docker/" \
            --exclude "openapi/" \
            --exclude "docker-start.sh" \
            --exclude "README.md" \
            --exclude "compose.yaml" \
            --exclude "compose.override.yaml" \
            --exclude "test-setup.php" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude "var/cache/" \
            --exclude "var/log/" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: 'Post-deploy: install deps, cache, migrations'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # OPTIONAL (if you want CI to manage env on the server):
            cat > .env.local <<'EOF'
            APP_ENV=prod
            APP_DEBUG=0
            APP_SECRET=${{ secrets.APP_SECRET }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            EOF

            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

            php bin/console cache:clear --env=prod
            php bin/console cache:warmup --env=prod

            # OPTIONAL: run only if you use Doctrine migrations
            php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
